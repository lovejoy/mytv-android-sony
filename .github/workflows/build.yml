name: Build MyTV Android

on:
  push:
    branches: [ main, develop, feature/* ]
  pull_request:
    branches: [ main, develop ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        module: [tv, mobile, allinone]
        build-type: [debug, release]
        
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" > local.properties
        
    - name: Generate debug keystore
      run: |
        keytool -genkey -v -keystore debug.keystore \
                -keyalg RSA -keysize 2048 -validity 10000 \
                -alias androiddebugkey \
                -storepass android -keypass android \
                -dname "CN=Android Debug,O=Android,C=US"
                
    - name: Update local.properties with keystore
      run: |
        echo "storeFile=debug.keystore" >> local.properties
        echo "storePassword=android" >> local.properties
        echo "keyAlias=androiddebugkey" >> local.properties
        echo "keyPassword=android" >> local.properties
        
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Build Debug APK
      if: matrix.build-type == 'debug'
      run: ./gradlew :${{ matrix.module }}:assembleDebug -x lint
      
    - name: Build Release APK
      if: matrix.build-type == 'release'
      run: ./gradlew :${{ matrix.module }}:assembleOriginalRelease -x lint
      
    - name: Upload Debug APK
      if: matrix.build-type == 'debug'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.module }}-debug-apk
        path: ${{ matrix.module }}/build/outputs/apk/debug/*.apk
        retention-days: 30
        
    - name: Upload Release APK
      if: matrix.build-type == 'release'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.module }}-release-apk
        path: ${{ matrix.module }}/build/outputs/apk/original/release/*.apk
        retention-days: 90
        
  test:
    runs-on: ubuntu-latest
    needs: build
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      
    - name: Cache Gradle dependencies
      uses: actions/cache@v3
      with:
        path: |
          ~/.gradle/caches
          ~/.gradle/wrapper
        key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}
        restore-keys: |
          ${{ runner.os }}-gradle-
          
    - name: Create local.properties
      run: echo "sdk.dir=$ANDROID_HOME" > local.properties
      
    - name: Make gradlew executable
      run: chmod +x ./gradlew
      
    - name: Run unit tests
      run: ./gradlew testDebugUnitTest
      
    - name: Run lint checks
      run: ./gradlew lintDebug
      
    - name: Upload test reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          */build/reports/tests/**
          */build/reports/lint-results-debug.html
        retention-days: 30